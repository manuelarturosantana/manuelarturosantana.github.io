{% include base_path %}

<p>Places I've given talks or attended workshops. Each pin comes from the <code>latitude</code> and <code>longitude</code> fields of a talk in <code>_talks/</code>.</p>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<div id="talkmap" style="height: 500px; width: 100%;"></div>

<script>
  var talks = [
    {% for talk in site.talks %}{% if talk.latitude and talk.longitude %}
    {
      lat: {{ talk.latitude }},
      lon: {{ talk.longitude }},
      title: {{ talk.title | jsonify }},
      location: {{ talk.location | jsonify }},
      date: {{ talk.date | date: '%B %Y' | jsonify }},
      url: {{ talk.url | prepend: base_path | jsonify }}
    },
    {% endif %}{% endfor %}
  ];

  var map = L.map('talkmap', { worldCopyJump: true });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  var bounds = [];
  talks.forEach(function (t) {
    L.marker([t.lat, t.lon]).addTo(map).bindPopup(
      '<a href="' + t.url + '">' + t.title + '</a><br>' + t.location + ' &middot; ' + t.date
    );
    bounds.push([t.lat, t.lon]);
  });

  if (bounds.length) {
    map.fitBounds(bounds, { padding: [40, 40], maxZoom: 5 });
  } else {
    map.setView([30, 0], 2);
  }
</script>
